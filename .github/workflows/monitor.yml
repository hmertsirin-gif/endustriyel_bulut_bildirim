name: Panel Izleyici

on:
  schedule:
    # Her 5 dakikada bir calisir. GitHub bu zamanlamayi birebir garanti etmez,
    # yogunluga gore birkaç dakika gecikebilir - normal.
    - cron: "*/5 * * * *"
  # Bu sayede "Actions" sekmesinden elle de "Run workflow" ile test edebilirsin.
  workflow_dispatch: {}

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Onceki calismalardan biriken veriyi geri yukle
        uses: actions/cache@v4
        with:
          path: |
            history.db
            monitor.log
          key: panel-durumu-${{ github.run_id }}
          restore-keys: |
            panel-durumu-

      - name: Kontrolu calistir
        env:
          SITE_COMPANY_ID: ${{ secrets.SITE_COMPANY_ID }}
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_SESSION_COOKIE: ${{ secrets.SITE_SESSION_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --once
