name: Panel Izleyici

on:
  repository_dispatch:
    types: [5dk_kontrol] # cron-job.org'dan gönderdiğimiz event_type ismi
  workflow_dispatch: {}  # Elle tetikleme butonunun kalması için

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Onceki calismalardan biriken veriyi geri yukle
        uses: actions/cache@v4
        with:
          path: |
            history.db
            monitor.log
          key: panel-durumu-${{ github.run_id }}
          restore-keys: |
            panel-durumu-

      - name: Kontrolu calistir
        env:
          SITE_COMPANY_ID: ${{ secrets.SITE_COMPANY_ID }}
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_SESSION_COOKIE: ${{ secrets.SITE_SESSION_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --once
